[build]
  # Production builds run the database migrations first (scripts/migrate.mjs); previews skip them.
  command = "node scripts/migrate.mjs --netlify && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Netlify's Next.js runtime (OpenNext adapter). Netlify also adds this
# automatically for Next.js sites; declaring it keeps builds explicit.
[[plugins]]
  package = "@netlify/plugin-nextjs"

